name: Update profile analytics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=dulaagamage&show_icons=true&line_height=30&card_width=410&theme=chartreuse-dark&hide_border=true&bg_color=0d1117
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate language statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=dulaagamage&layout=compact&langs_count=6&card_width=410&theme=chartreuse-dark&hide_border=true&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate contribution line graph
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/activity_graph.py
        
      - name: Save updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/activity.svg
          if git diff --cached --quiet; then
            echo "Cards are unchanged."
            exit 0
          fi
          git commit -m "Update profile analytics"
          git push
